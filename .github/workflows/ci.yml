name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Run tests
        run: cargo test

  docker:
    if: github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/'))
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/logbook
        run: |
          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          tags="$image:${GITHUB_SHA}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            tags="$tags,$image:latest"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tags="$tags,$image:latest,$image:${GITHUB_REF_NAME}"
          fi
          echo "value=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.value }}
